dataset:
  dataset: hvfhv
  year: 2024
  start_month: 1
  end_month: 7
  timezone: America/New_York

templates:
  validation: configs/data/validation.yaml
  demand_aggregation: configs/data/demand_aggregation.yaml

paths:
  raw_directory: data/raw/hvfhv
  zone_lookup: data/reference/taxi_zone_lookup.csv
  interim_directory: data/interim/multimonth_july
  monthly_demand_directory: data/processed/full/monthly
  generated_config_directory: artifacts/generated_configs/multimonth_july
  combined_output: data/processed/full/zone_demand_15m_2024-01_2024-07.parquet
  report: reports/data_quality/2024-01_2024-07-multimonth.json

execution:
  download_missing: true
  validate_missing: true
  aggregate_missing: true
  force_download: false
  force_validation: false
  force_aggregation: false
  force_combine: false
  cleanup_interim_after_aggregation: false

output:
  compression: zstd
