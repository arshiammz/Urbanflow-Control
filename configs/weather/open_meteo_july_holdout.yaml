api:
  endpoint: https://single-runs-api.open-meteo.com/v1/forecast
  model: ecmwf_ifs
  forecast_hours: 18
  availability_delay_hours: 6
  timeout_seconds: 90
  request_delay_seconds: 0.20
  retries: 5
  allow_missing_runs: true

chronology:
  start_date: "2024-03-14"
  end_date_exclusive: "2024-08-01"
  run_hours_utc: [0, 6, 12, 18]
  interval_minutes: 15
  timezone: America/New_York

paths:
  zone_centroids: data/reference/taxi_zone_centroids.csv
  weather_archive: data/processed/weather/nyc_2024-03-14_2024-07-31_asof.parquet
  report: reports/data_quality/nyc-weather-asof-july-holdout.json

output:
  compression: zstd
