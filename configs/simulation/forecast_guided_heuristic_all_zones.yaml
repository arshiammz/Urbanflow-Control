dataset:
  name: nyc_hvfhv_graph_weather_quantile_rebalancing_all_zones

paths:
  baseline_config: configs/simulation/real_episode_baseline_all_zones.yaml
  forecast_predictions: data/processed/full/quantile_graph_weather_predictions_15m_2024-01_2024-06.parquet
  zone_graph: data/processed/spatial/nyc_taxi_zone_graph_all_eligible.json
  step_metrics: reports/simulation/forecast_guided_all_zones/2024-05-15-step-metrics.parquet
  interval_zone_metrics: reports/simulation/forecast_guided_all_zones/2024-05-15-interval-zone-metrics.parquet
  zone_summary: reports/simulation/forecast_guided_all_zones/2024-05-15-zone-summary.parquet
  report: reports/simulation/2024-05-15-forecast-guided-all-zones.json

forecast:
  timestamp_column: interval_start
  zone_column: zone_id
  prediction_column: p50_demand
  upper_prediction_column: p90_demand
  split_column: split

policy:
  name: forecast_guided_greedy
  forecast_horizon_steps: 4
  demand_buffer_multiplier: 1.05
  minimum_zone_reserve: 1
  maximum_relocation_steps: 2
  maximum_relocation_fraction: 0.15
  in_transit_supply_credit: 0.25
  # Blend P50 and P90 to express uncertainty aversion in the demand target.
  risk_aversion: 0.50
  apply_during_warmup: false

output:
  compression: zstd
