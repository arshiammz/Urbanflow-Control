# No May label is allowed to influence the model used to forecast May.
paths:
  xgboost_config: configs/forecasting/xgboost.yaml
  predictions: data/processed/simulation/nyc_2024-01_2024-06/asof_validation_predictions.parquet
  model: artifacts/models/xgboost-asof-may/model.ubj
