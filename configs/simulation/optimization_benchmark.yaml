dataset:
  name: nyc_hvfhv_phase3_four_policy_optimization_benchmark

paths:
  baseline_config: configs/simulation/real_episode_baseline_all_zones.yaml
  greedy_config: configs/simulation/forecast_guided_heuristic_all_zones.yaml
  decision_time_forecasts: data/processed/full/decision_time_quantile_horizon_15m_2024-01_2024-06.parquet
  zone_graph: data/processed/spatial/nyc_taxi_zone_graph_all_eligible.json
  zone_lookup: data/reference/taxi_zone_lookup.csv

  step_metrics: reports/simulation/optimization_benchmark/2024-05-15-step-metrics.parquet
  interval_zone_metrics: reports/simulation/optimization_benchmark/2024-05-15-interval-zone-metrics.parquet
  zone_summary: reports/simulation/optimization_benchmark/2024-05-15-zone-summary.parquet
  region_summary: reports/simulation/optimization_benchmark/2024-05-15-region-summary.parquet
  report: reports/simulation/2024-05-15-optimization-benchmark.json

benchmark:
  # Must match configs/forecasting/decision_time_quantile_horizon.yaml.
  forecast_horizon_steps: 4
  # Currency-like soft penalty used to prioritize historically under-served TLC boroughs.
  fairness_cost_weight: 0.75

output:
  compression: zstd
