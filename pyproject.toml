[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-control"
version = "0.1.0"
description = "Forecast-aware fleet rebalancing decision system"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "pyarrow",
    "duckdb",
    "pydantic",
    "pyyaml",
    "typer",
    "rich",
    "httpx",
    "pyproj>=3.6",
    "pyshp>=2.3",
    "numpy==2.5.1",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0,<2.0",
    "torch>=2.3,<3.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "prometheus-client>=0.20,<1.0",
]
dashboard = [
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
    "pandas>=2.2,<4.0",
    "requests>=2.32,<3.0",
]
mlops = [
    "mlflow>=2.17,<4.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true