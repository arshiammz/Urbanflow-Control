<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#68727D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#20242B" flood-opacity="0.06"/></filter>
</defs>
<rect width="1600" height="1000" fill="#FBFAF7"/>
<text x="800" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="1.2" fill="#20242B">SPATIOTEMPORAL FORECASTING ENGINE</text>
<text x="800" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#626B76">From raw trip events to decision-time probabilistic demand forecasts</text>
<text x="70" y="165" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#20242B">TEMPORAL EVALUATION CONTRACT</text><rect x="70" y="190" width="420" height="90" rx="16" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="7 6"/><text x="280.0" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750" fill="#20242B">JAN — APR 2024</text><text x="280.0" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Model fitting / train-only statistics</text><rect x="500" y="190" width="500" height="90" rx="16" fill="#FFF4DD" stroke="#D6A54A" stroke-width="2.3" stroke-dasharray="7 6"/><text x="750.0" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750" fill="#20242B">MAY — JUN 2024</text><text x="750.0" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Development validation / test</text><rect x="1010" y="190" width="520" height="90" rx="16" fill="#FFF0EC" stroke="#D78B7C" stroke-width="2.3" stroke-dasharray="7 6"/><text x="1270.0" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750" fill="#20242B">JUL 2024</text><text x="1270.0" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Untouched final holdout</text><rect x="70" y="355" width="260" height="170" rx="18" fill="#FFF4DD" stroke="#D6A54A" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="94" y="393" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">1  Source records</text><text x="94" y="433" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#626B76"><tspan x="94" dy="0">NYC TLC HVFHV Parquet</tspan><tspan x="94" dy="22">Trip timestamps · pickup zones</tspan><tspan x="94" dy="22">TLC zone lookup and geometry</tspan></text><rect x="390" y="355" width="260" height="170" rx="18" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="414" y="393" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">2  Data contracts</text><text x="414" y="433" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#626B76"><tspan x="414" dy="0">Schema / null / duplicate audit</tspan><tspan x="414" dy="22">15-minute × zone dense panel</tspan><tspan x="414" dy="22">Chronological split enforcement</tspan></text><rect x="710" y="355" width="260" height="170" rx="18" fill="#EAF6EE" stroke="#6EA47A" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="734" y="393" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">3  Feature construction</text><text x="734" y="433" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#626B76"><tspan x="734" dy="0">Lags and shifted rolling windows</tspan><tspan x="734" dy="22">Calendar and cyclical encodings</tspan><tspan x="734" dy="22">Graph-neighbour historical lags</tspan></text><rect x="1030" y="355" width="260" height="170" rx="18" fill="#F2EDFF" stroke="#9B84CF" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="1054" y="393" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">4  As-of context</text><text x="1054" y="433" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#626B76"><tspan x="1054" dy="0">ECMWF IFS archived forecast runs</tspan><tspan x="1054" dy="22">available_at ≤ decision_time</tspan><tspan x="1054" dy="22">Six-hour conservative delay</tspan></text><rect x="1350" y="355" width="190" height="170" rx="18" fill="#E8F6F5" stroke="#69A9A5" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="1374" y="393" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">5  Model inputs</text><text x="1374" y="433" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="450" fill="#626B76"><tspan x="1374" dy="0">Zone-time rows</tspan><tspan x="1374" dy="22">Fixed feature schema</tspan><tspan x="1374" dy="22">Provenance metadata</tspan></text><path d="M330,440 L390,440" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M650,440 L710,440" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M970,440 L1030,440" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1290,440 L1350,440" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1445,525 L1445,610" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="220" y="610" width="1160" height="235" rx="22" fill="#FFFFFF" stroke="#B7BEC6" stroke-width="2" stroke-dasharray="6 7"/><text x="800" y="650" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750" fill="#20242B">GLOBAL XGBOOST QUANTILE FORECASTER</text><rect x="300" y="685" width="220" height="95" rx="18" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="1.8" stroke-dasharray="none"/><text x="410" y="725" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#20242B">P10</text><text x="410" y="755" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Lower demand quantile</text><rect x="690" y="685" width="220" height="95" rx="18" fill="#EAF6EE" stroke="#6EA47A" stroke-width="1.8" stroke-dasharray="none"/><text x="800" y="725" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#20242B">P50</text><text x="800" y="755" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Median demand estimate</text><rect x="1080" y="685" width="220" height="95" rx="18" fill="#FFF0EC" stroke="#D78B7C" stroke-width="1.8" stroke-dasharray="none"/><text x="1190" y="725" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#20242B">P90</text><text x="1190" y="755" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Upper demand quantile</text><text x="800" y="815" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="550" fill="#626B76">Monotonic quantile ordering  ·  Non-negative predictions  ·  Pinball loss / coverage / interval width</text><path d="M800,845 L800,885" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="310" y="885" width="980" height="70" rx="16" fill="#E8F6F5" stroke="#69A9A5" stroke-width="2.3" stroke-dasharray="7 6"/><text x="800" y="915" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650" fill="#20242B">Decision-time horizon: one-step quantile anchor + train-only weekly profile for future steps</text><text x="800" y="945" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#626B76">Graph context is feature-based (not a learned GNN); future horizon steps are not recursively re-inferred.</text></svg>