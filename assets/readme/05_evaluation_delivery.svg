30" y="815" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#626B76">Forecast / plan / preview endpoints</text><text x="850" y="840" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#20242B">Streamlit</text><text x="1030" y="840" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#626B76">Operational dashboard</text><text x="850" y="865" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#20242B">Docker Compose</text><text x="1030" y="865" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#626B76">API · dashboard · MLflow · Prometheus</text><text x="850" y="890" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#20242B">Governance</text><text x="1030" y="890" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#626B76">SHA-256 manifest · verification · rollback</text><text x="800" y="970" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#626B76">The July runner and delivery stack are implemented; publish measured results only after the full local holdout run succeeds.</text></svg>