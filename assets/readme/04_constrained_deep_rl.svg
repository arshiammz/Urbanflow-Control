<rect width="1600" height="1000" fill="#FBFAF7"/>
<text x="800" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="1.2" fill="#20242B">CONSTRAINED DEEP REINFORCEMENT LEARNING</text>
<text x="800" y="100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#626B76">Gymnasium environment + graph-aware PyTorch PPO with deterministic action projection</text>
<rect x="55" y="175" width="340" height="630" rx="22" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="8 7"/><text x="225" y="220" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#20242B">GYMNASIUM ENVIRONMENT</text><rect x="85" y="255" width="280" height="115" rx="18" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="225.0" y="293" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Observation</text><text x="225.0" y="321" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Zone features (N × 10) + global fleet/time state</text><rect x="85" y="400" width="280" height="115" rx="18" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="225.0" y="438" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Hidden from policy</text><text x="225.0" y="466" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Current realized demand is not in observation</text><rect x="85" y="545" width="280" height="115" rx="18" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="225.0" y="583" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Transition</text><text x="225.0" y="611" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Actual historical demand + pending arrivals</text><rect x="85" y="690" width="280" height="85" rx="18" fill="#EAF3FF" stroke="#6C9BD2" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="225.0" y="728" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Invariant</text><text x="225.0" y="756" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Available + in-transit = total fleet</text><rect x="455" y="175" width="690" height="630" rx="22" fill="#F2EDFF" stroke="#9B84CF" stroke-width="2.3" stroke-dasharray="8 7"/><text x="800" y="220" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#20242B">GRAPH-AWARE ACTOR / CRITIC</text><rect x="500" y="270" width="270" height="110" rx="18" fill="#F2EDFF" stroke="#9B84CF" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="635.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Shared zone encoder</text><text x="635.0" y="336" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Per-zone representation from state features</text><rect x="825" y="270" width="270" height="110" rx="18" fill="#F2EDFF" stroke="#9B84CF" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="960.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Edge scorer</text><text x="960.0" y="336" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Origin embedding + destination embedding + travel time</text><path d="M770,325 L825,325" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="500" y="430" width="270" height="100" rx="18" fill="#E8F6F5" stroke="#69A9A5" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="635.0" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Budget head</text><text x="635.0" y="496" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Relocation intensity / global budget fraction</text><rect x="825" y="430" width="270" height="100" rx="18" fill="#E8F6F5" stroke="#69A9A5" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="960.0" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Squashed Gaussian</text><text x="960.0" y="496" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Continuous proposal + PPO log probability</text><path d="M770,480 L825,480" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="665" y="585" width="270" height="105" rx="18" fill="#FFF0EC" stroke="#D78B7C" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="800.0" y="623" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Action projection</text><text x="800.0" y="651" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Integer OD moves; graph / supply / time / budget checks</text><path d="M960,530 L825,585" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="800" y="740" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="550" fill="#626B76">PPO clip objective · GAE · value loss · entropy · gradient clipping</text><rect x="1205" y="175" width="340" height="630" rx="22" fill="#EAF6EE" stroke="#6EA47A" stroke-width="2.3" stroke-dasharray="8 7"/><text x="1375" y="220" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#20242B">TRAINING OBJECTIVE</text><rect x="1235" y="270" width="280" height="105" rx="18" fill="#EAF6EE" stroke="#6EA47A" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="1375.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Operational reward</text><text x="1375.0" y="336" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Service rate − normalized cost − idle fleet</text><rect x="1235" y="405" width="280" height="105" rx="18" fill="#EAF6EE" stroke="#6EA47A" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="1375.0" y="443" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Fairness penalty</text><text x="1375.0" y="471" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Soft penalty for regional service-rate gap</text><rect x="1235" y="540" width="280" height="105" rx="18" fill="#EAF6EE" stroke="#6EA47A" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="1375.0" y="578" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Primal–dual update</text><text x="1375.0" y="606" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">Non-negative multiplier rises with violations</text><rect x="1235" y="675" width="280" height="100" rx="18" fill="#EAF6EE" stroke="#6EA47A" stroke-width="2.3" stroke-dasharray="7 6" filter="url(#soft)"/><text x="1375.0" y="713" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="720" fill="#20242B">Training protocol</text><text x="1375.0" y="741" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#626B76">3 seeds · train-only selection · frozen checkpoint</text><path d="M395,470 L455,470" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1145,635 L1205,635" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M935,635 L985,635" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M985,635 L985,850" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><path d="M985,850 L225,850" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><path d="M225,850 L225,805" fill="none" stroke="#68727D" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="800" y="915" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="550" fill="#626B76">Hard feasibility is enforced by projection; fairness remains a soft objective, not a guarantee of equal service.</text><text x="800" y="950" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#626B76">Training uses a train-only causal forecast proxy; May/June inference uses Phase 2 quantile forecasts — a documented distribution shift.</text></svg>