services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RL: ${URBANFLOW_INSTALL_RL:-0}
    image: urbanflow-control:local
    command: uvicorn urbanflow.api.app:app --host 0.0.0.0 --port 8000
    environment:
      URBANFLOW_API_KEY: ${URBANFLOW_API_KEY:-}
      URBANFLOW_MODEL_MANIFEST: ${URBANFLOW_MODEL_MANIFEST:-artifacts/production/model_manifest.json}
      URBANFLOW_BASELINE_CONFIG: ${URBANFLOW_BASELINE_CONFIG:-artifacts/generated_configs/final_holdout_july/final-holdout-baseline.yaml}
      URBANFLOW_GREEDY_CONFIG: ${URBANFLOW_GREEDY_CONFIG:-artifacts/generated_configs/final_holdout_july/final-holdout-greedy.yaml}
      URBANFLOW_DECISION_TIME_FORECASTS: ${URBANFLOW_DECISION_TIME_FORECASTS:-data/processed/full/decision_time_quantile_horizon_15m_2024-01_2024-07.parquet}
      URBANFLOW_ZONE_GRAPH: ${URBANFLOW_ZONE_GRAPH:-data/processed/spatial/nyc_taxi_zone_graph_july_holdout.json}
      URBANFLOW_ZONE_LOOKUP: ${URBANFLOW_ZONE_LOOKUP:-data/reference/taxi_zone_lookup.csv}
      URBANFLOW_RL_CONFIG: ${URBANFLOW_RL_CONFIG:-artifacts/generated_configs/final_holdout_july/final-holdout-rl.yaml}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
      - ./reports:/app/reports:ro
      - ./configs:/app/configs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - mlflow
    restart: unless-stopped

  dashboard:
    image: urbanflow-control:local
    command: streamlit run dashboards/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      URBANFLOW_API_URL: http://api:8000
      URBANFLOW_API_KEY: ${URBANFLOW_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - ./mlruns:/mlflow
    ports:
      - "5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  prometheus_data:
